spring:
  application:
    name: MedVoll

  datasource:
    url: jdbc:mysql://localhost:3306/vollmed_api?createDatabaseIfNotExist=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  server:
    error:
      include-stacktrace: never


